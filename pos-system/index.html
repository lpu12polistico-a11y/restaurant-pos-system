<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap POS Demo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">

    <div class="row">

        <!-- MENU -->
        <div class="col-md-9 border rounded p-3 bg-white">

            <h1 class="mb-4">Menu</h1>

            <div class="row">

                <!-- BURGER -->
                <div class="col-md-3 mb-3">

                    <div class="card">

                        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=500"
                             class="card-img-top food-image">

                        <div class="card-body">

                            <h2>Burger</h2>

                            <h3>60 PHP</h3>

                            <input type="number"
                                   id="burgerQty"
                                   class="form-control"
                                   placeholder="Enter how many">

                            <button class="btn btn-primary w-100"
                                    onclick="addOrder('Burger',60,'burgerQty')">

                                Add to order

                            </button>

                        </div>

                    </div>

                </div>

                <!-- FISHBALL -->
                <div class="col-md-3 mb-3">

                    <div class="card">

                        <img src="https://png.pngtree.com/element_pic/16/12/01/f9e4ddcef720f395cc284c37b1c9fd6d.png"
     class="card-img-top food-image">

                        <div class="card-body">

                            <h2>Fishbol</h2>

                            <h3>20 PHP</h3>

                            <input type="number"
                                   id="fishbolQty"
                                   class="form-control"
                                   placeholder="Enter how many">

                            <button class="btn btn-primary w-100"
                                    onclick="addOrder('Fishbol',20,'fishbolQty')">

                                Add to order

                            </button>

                        </div>

                    </div>

                </div>

                <!-- KWEK-KWEK -->
                <div class="col-md-3 mb-3">

                    <div class="card">

                        <img src="https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?q=80&w=500"
                             class="card-img-top food-image">

                        <div class="card-body">

                            <h2>Kwek-kwek</h2>

                            <h3>25 PHP</h3>

                            <input type="number"
                                   id="kwekQty"
                                   class="form-control"
                                   placeholder="Enter how many">

                            <button class="btn btn-primary w-100"
                                    onclick="addOrder('Kwek-kwek',25,'kwekQty')">

                                Add to order

                            </button>

                        </div>

                    </div>

                </div>

                <!-- KIKIAM -->
                <div class="col-md-3 mb-3">

                    <div class="card">

                        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=500"
                             class="card-img-top food-image">

                        <div class="card-body">

                            <h2>Kikiam</h2>

                            <h3>20 PHP</h3>

                            <input type="number"
                                   id="kikiamQty"
                                   class="form-control"
                                   placeholder="Enter how many">

                            <button class="btn btn-primary w-100"
                                    onclick="addOrder('Kikiam',20,'kikiamQty')">

                                Add to order

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- ORDERED ITEMS -->
        <div class="col-md-3 border rounded p-3 bg-white">

            <h1>Ordered Items</h1>

            <div id="orderedItems"></div>

            <hr>

            <h1 id="totalText">Total:</h1>

            <input type="number"
                   id="payment"
                   class="form-control mb-2"
                   placeholder="Enter the amount here">

            <button class="btn btn-success float-end"
                    onclick="payOrder()">

                Pay!

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
